<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Emissão de CO2 - EcoTrip</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1 class="header__title">🌱 Calculadora de Emissão de CO2</h1>
        <p class="header__subtitle">Calcule e compare as emissões de CO2 das suas viagens para fazer escolhas mais sustentáveis</p>
    </header>

    <main class="main">
        <form id="calculator-form" class="calculator-form">
            <div class="form-group">
                <label for="origin" class="form-group__label">Origem:</label>
                <input type="text" id="origin" class="form-group__input" placeholder="Digite a cidade de origem" list="cities-list" required>
            </div>

            <div class="form-group">
                <label for="destination" class="form-group__label">Destino:</label>
                <input type="text" id="destination" class="form-group__input" placeholder="Digite a cidade de destino" list="cities-list" required>
            </div>

            <datalist id="cities-list">
                <!-- Cidades serão populadas pelo JavaScript -->
            </datalist>

            <div class="form-group">
                <label for="distance" class="form-group__label">Distância (km):</label>
                <input type="number" id="distance" class="form-group__input" readonly>
                <small class="form-group__helper">A distância será preenchida automaticamente</small>
            </div>

            <div class="form-group">
                <label class="checkbox">
                    <input type="checkbox" id="manual-distance" class="checkbox__input">
                    <span class="checkbox__label">Inserir distância manualmente</span>
                </label>
            </div>

            <div class="form-group">
                <fieldset class="transport-selector">
                    <legend class="transport-selector__legend">Meio de transporte:</legend>
                    <div class="transport-selector__grid">
                        <label class="transport-option">
                            <input type="radio" name="transport" value="bicycle" class="transport-option__input">
                            <span class="transport-option__label">🚴 Bicicleta</span>
                        </label>
                        
                        <label class="transport-option">
                            <input type="radio" name="transport" value="car" class="transport-option__input" checked>
                            <span class="transport-option__label">🚗 Carro</span>
                        </label>
                        
                        <label class="transport-option">
                            <input type="radio" name="transport" value="bus" class="transport-option__input">
                            <span class="transport-option__label">🚌 Ônibus</span>
                        </label>
                        
                        <label class="transport-option">
                            <input type="radio" name="transport" value="truck" class="transport-option__input">
                            <span class="transport-option__label">🚛 Caminhão</span>
                        </label>
                    </div>
                </fieldset>
            </div>

            <button type="submit" class="calculator-form__submit">Calcular Emissão</button>
        </form>

        <section id="results" class="results hidden">
            <div id="results-content" class="results__content"></div>
        </section>

        <section id="comparison" class="comparison hidden">
            <div id="comparison-content" class="comparison__content"></div>
        </section>

        <section id="carbon-credits" class="carbon-credits hidden">
            <div id="carbon-credits-content" class="carbon-credits__content"></div>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__credits">Desenvolvido com ❤️ para a DIO | Projeto Github Copilot do Nícollas</p>
    </footer>

    <script src="js/routes-data.js"></script>
    <script src="js/config.js"></script>
    <script src="js/calculator.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
