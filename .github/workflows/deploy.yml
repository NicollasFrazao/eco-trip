name: Deploy to GitHub Pages

# Workflow triggers
on:
  # Trigger on push to main branch
  push:
    branches:
      - main
  
  # Allow manual trigger from Actions tab
  workflow_dispatch:

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Concurrency control to prevent multiple deployments at once
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout repository
      - name: Checkout
        uses: actions/checkout@v4
      
      # Step 2: Setup GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # Step 3: Upload artifact from root directory
      # This workflow deploys static files directly - no build process needed
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      # Step 4: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
